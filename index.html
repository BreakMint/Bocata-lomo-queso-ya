<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boca Lomo Queso Ya</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #f7d794;
  }

  #game {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 20% 20%, #fff4cf 0 8%, transparent 9%),
      linear-gradient(#f9e7b2, #e9c46a);
  }

  #hud {
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    display: flex;
    gap: 18px;
    align-items: center;
    padding: 10px 18px;
    border-radius: 18px;
    background: rgba(255,255,255,.9);
    box-shadow: 0 5px 20px rgba(0,0,0,.15);
    font-weight: bold;
    font-size: 20px;
  }

  #person {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    width: 180px;
    text-align: center;
  }

  .head {
    width: 110px;
    height: 110px;
    margin: auto;
    border-radius: 50%;
    background: #f2bd85;
    border: 4px solid #9b5b35;
    position: relative;
  }
  .eye {
    position: absolute;
    top: 40px;
    width: 12px;
    height: 16px;
    background: #222;
    border-radius: 50%;
  }
  .eye.left { left: 27px; }
  .eye.right { right: 27px; }

  .mouth {
    position: absolute;
    left: 30px;
    bottom: 18px;
    width: 50px;
    height: 25px;
    border-radius: 0 0 30px 30px;
    background: #461f1f;
  }

  .body {
    width: 125px;
    height: 120px;
    margin: -3px auto 0;
    border-radius: 45px 45px 20px 20px;
    background: #5b7cfa;
    border: 4px solid #334ca8;
  }

  #speech {
    position: absolute;
    width: max-content;
    max-width: 280px;
    left: 50%;
    bottom: 100%;
    transform: translateX(-50%);
    margin-bottom: 14px;
    padding: 12px 16px;
    border-radius: 18px;
    background: white;
    border: 3px solid #222;
    font-weight: 900;
    font-size: 18px;
  }
  #speech:after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -13px;
    transform: translateX(-50%);
    border: 7px solid transparent;
    border-top-color: #222;
  }

  .sandwich {
    position: absolute;
    z-index: 20;
    width: 100px;
    height: 48px;
    cursor: grab;
    touch-action: none;
    filter: drop-shadow(0 5px 4px rgba(0,0,0,.25));
  }
  .sandwich:active { cursor: grabbing; }

  .bread {
    position: absolute;
    left: 3px;
    width: 94px;
    height: 25px;
    border-radius: 45% 45% 25% 25%;
    background: #d99442;
    border: 3px solid #9a5c20;
  }
  .bread.top {
    top: 0;
    transform: rotate(-2deg);
  }
  .bread.bottom {
    bottom: 0;
    height: 20px;
    border-radius: 20% 20% 45% 45%;
  }
  .meat {
    position: absolute;
    left: 10px;
    top: 20px;
    width: 80px;
    height: 15px;
    background: #8e4930;
    border: 2px solid #633020;
    border-radius: 45%;
    transform: rotate(2deg);
  }
  .cheese {
    position: absolute;
    left: 13px;
    top: 25px;
    width: 74px;
    height: 9px;
    background: #ffd447;
    transform: skewX(-12deg);
    border: 1px solid #d9a600;
  }

  #menu, #gameOver {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(34, 34, 34, .45);
  }

  .panel {
    text-align: center;
    background: white;
    padding: 38px;
    border-radius: 28px;
    min-width: 320px;
    box-shadow: 0 15px 50px rgba(0,0,0,.3);
  }
  h1 { margin-top: 0; font-size: 38px; }
  button {
    border: 0;
    padding: 15px 35px;
    border-radius: 15px;
    background: #e85d04;
    color: white;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { transform: scale(1.05); }

  #gameOver { display: none; }
  #message { font-size: 22px; margin-bottom: 20px; }
  #count { color: #e85d04; }

  .pop {
    position: absolute;
    z-index: 40;
    pointer-events: none;
    font-weight: 900;
    color: #2a9d8f;
    font-size: 24px;
    animation: pop .5s forwards;
  }
  @keyframes pop {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to { opacity: 0; transform: translateY(-45px) scale(1.5); }
  }
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <span>🥪 Bocadillos: <span id="score">0</span></span>
    <span>⏱️ <span id="time">20</span>s</span>
  </div>

  <div id="person">
    <div id="speech">¡Boca lomo queso ya!</div>
    <div class="head">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="mouth"></div>
    </div>
    <div class="body"></div>
  </div>

  <div id="menu">
    <div class="panel">
      <h1>🥪 BOCA LOMO 🥪</h1>
      <p>Arrastra los bocadillos a la persona.</p>
      <p>¡Tienes <b>20 segundos</b> para conseguir la mayor puntuación!</p>
      <button id="startBtn">INICIAR</button>
    </div>
  </div>

  <div id="gameOver">
    <div class="panel">
      <h1>¡Se acabó el tiempo!</h1>
      <div id="message">Has dado <span id="finalScore" class="count">0</span> bocadillos.</div>
      <button id="againBtn">JUGAR OTRA VEZ</button>
    </div>
  </div>
</div>

<script>
const game = document.getElementById("game");
const person = document.getElementById("person");
const scoreEl = document.getElementById("score");
const timeEl = document.getElementById("time");
const menu = document.getElementById("menu");
const gameOver = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");

let score = 0;
let time = 20;
let running = false;
let timer = null;
let spawnTimer = null;
let dragged = null;
let offsetX = 0;
let offsetY = 0;

function createSandwich() {
  if (!running) return;

  const s = document.createElement("div");
  s.className = "sandwich";
  s.innerHTML = `
    <div class="bread top"></div>
    <div class="meat"></div>
    <div class="cheese"></div>
    <div class="bread bottom"></div>
  `;

  const maxX = window.innerWidth - 115;
  const maxY = window.innerHeight - 70;

  s.style.left = (20 + Math.random() * Math.max(20, maxX - 20)) + "px";
  s.style.top = (75 + Math.random() * Math.max(20, maxY - 75)) + "px";

  // Evita que aparezca demasiado cerca de la persona
  const p = person.getBoundingClientRect();
  let rect = s.getBoundingClientRect();
  let attempts = 0;
  while (overlap(rect, p) && attempts++ < 10) {
    s.style.left = (20 + Math.random() * Math.max(20, maxX - 20)) + "px";
    s.style.top = (75 + Math.random() * Math.max(20, maxY - 75)) + "px";
    rect = s.getBoundingClientRect();
  }

  s.addEventListener("pointerdown", startDrag);
  game.appendChild(s);

  // Si nadie lo recoge, desaparece después de un rato.
  setTimeout(() => {
    if (s.isConnected && s !== dragged) s.remove();
  }, 10000);
}

function overlap(a, b) {
  return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
}

function startDrag(e) {
  if (!running) return;
  dragged = e.currentTarget;
  dragged.setPointerCapture(e.pointerId);

  const r = dragged.getBoundingClientRect();
  offsetX = e.clientX - r.left;
  offsetY = e.clientY - r.top;

  dragged.addEventListener("pointermove", moveDrag);
  dragged.addEventListener("pointerup", endDrag);
}

function moveDrag(e) {
  if (!dragged) return;
  const x = e.clientX - offsetX;
  const y = e.clientY - offsetY;
  dragged.style.left = x + "px";
  dragged.style.top = y + "px";
}

function endDrag(e) {
  if (!dragged) return;

  dragged.removeEventListener("pointermove", moveDrag);
  dragged.removeEventListener("pointerup", endDrag);

  const sandwichRect = dragged.getBoundingClientRect();
  const personRect = person.getBoundingClientRect();

  if (overlap(sandwichRect, personRect)) {
    score++;
    scoreEl.textContent = score;
    showPop("+1 🥪", e.clientX, e.clientY);
    dragged.remove();
  }

  dragged = null;
}

function showPop(text, x, y) {
  const pop = document.createElement("div");
  pop.className = "pop";
  pop.textContent = text;
  pop.style.left = x + "px";
  pop.style.top = y + "px";
  game.appendChild(pop);
  setTimeout(() => pop.remove(), 500);
}

function startGame() {
  score = 0;
  time = 20;
  running = true;
  scoreEl.textContent = "0";
  timeEl.textContent = "20";

  menu.style.display = "none";
  gameOver.style.display = "none";

  document.querySelectorAll(".sandwich").forEach(s => s.remove());

  // Primera tanda
  for (let i = 0; i < 5; i++) {
    setTimeout(createSandwich, i * 150);
  }

  spawnTimer = setInterval(() => {
    // Mantiene varios bocadillos disponibles
    const current = document.querySelectorAll(".sandwich").length;
    if (current < 8) createSandwich();
  }, 700);

  timer = setInterval(() => {
    time--;
    timeEl.textContent = time;

    if (time <= 0) endGame();
  }, 1000);
}

function endGame() {
  running = false;
  clearInterval(timer);
  clearInterval(spawnTimer);
  timer = null;
  spawnTimer = null;

  document.querySelectorAll(".sandwich").forEach(s => s.remove());
  finalScore.textContent = score;
  gameOver.style.display = "flex";
}

document.getElementById("startBtn").addEventListener("click", startGame);
document.getElementById("againBtn").addEventListener("click", startGame);
</script>
</body>
</html>
